version: 2

sphinx:
  configuration: docs/source/conf.py

build:
  os: "ubuntu-22.04"
  tools:
    python: "miniconda-latest"
  jobs:
    pre_build:
      # Download DSPS SSP data and LSST filter curves
      - mkdir -p docs/source/dsps_drn/filters
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/ssp-data-v1/fsps_v0.4.7_mist_c3k_a_kroupa_wNE_logGasU-2.0_logGasZ0.0.sparse.h5 -P docs/source/dsps_drn
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/filters-v1/lsst_u_transmission.h5 -P docs/source/dsps_drn/filters
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/filters-v1/lsst_g_transmission.h5 -P docs/source/dsps_drn/filters
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/filters-v1/lsst_r_transmission.h5 -P docs/source/dsps_drn/filters
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/filters-v1/lsst_i_transmission.h5 -P docs/source/dsps_drn/filters
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/filters-v1/lsst_z_transmission.h5 -P docs/source/dsps_drn/filters
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/filters-v1/lsst_y_transmission.h5 -P docs/source/dsps_drn/filters
      - export DSPS_DRN="dsps_drn"

      # Download a pre-computed Diffsky-native mock for use in demo notebooks
      - mkdir -p docs/source/mock_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/hacc-data-lastjourney-v1/lc_cores-decomposition.txt -P docs/source/mock_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/mock-galaxies-v2/diffsky_c260710_test_09_15_2026_param_collection.hdf5 -P docs/source/mock_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/mock-galaxies-v2/diffsky_c260710_test_09_15_2026_ssp_data.hdf5 -P docs/source/mock_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/mock-galaxies-v2/diffsky_c260710_test_09_15_2026_transmission_curves.hdf5 -P docs/source/mock_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/mock-galaxies-v2/diffsky_c260710_test_09_15_2026_t_table.hdf5 -P docs/source/mock_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/mock-galaxies-v2/testmock_cfg.yaml -P docs/source/mock_download_dir

      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/mock-galaxies-v2/lc_cores-411.843.diffsky_gals.hdf5 -P docs/source/mock_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/mock-galaxies-v2/lc_cores-421.843.diffsky_gals.hdf5 -P docs/source/mock_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/mock-galaxies-v2/lc_cores-432.843.diffsky_gals.hdf5 -P docs/source/mock_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/mock-galaxies-v2/lc_cores-442.843.diffsky_gals.hdf5 -P docs/source/mock_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/mock-galaxies-v2/lc_cores-453.843.diffsky_gals.hdf5 -P docs/source/mock_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/mock-galaxies-v2/lc_cores-464.843.diffsky_gals.hdf5 -P docs/source/mock_download_dir

      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/mock-galaxies-v2/lc_cores-411.843.diffsky_gals.synthetic_halos.hdf5 -P docs/source/mock_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/mock-galaxies-v2/lc_cores-421.843.diffsky_gals.synthetic_halos.hdf5 -P docs/source/mock_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/mock-galaxies-v2/lc_cores-432.843.diffsky_gals.synthetic_halos.hdf5 -P docs/source/mock_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/mock-galaxies-v2/lc_cores-442.843.diffsky_gals.synthetic_halos.hdf5 -P docs/source/mock_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/mock-galaxies-v2/lc_cores-453.843.diffsky_gals.synthetic_halos.hdf5 -P docs/source/mock_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/mock-galaxies-v2/lc_cores-464.843.diffsky_gals.synthetic_halos.hdf5 -P docs/source/mock_download_dir

      - ls -l docs/source/mock_download_dir

      # Download a pre-computed OpenCosmo-formatted mock for use in demo notebooks
      - mkdir -p docs/source/oc_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/hacc-data-lastjourney-v1/lc_cores-decomposition.txt -P docs/source/oc_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/oc-mock-galaxies-v1/diffsky_c260710_test_09_15_2026_param_collection.hdf5 -P docs/source/oc_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/oc-mock-galaxies-v1/diffsky_c260710_test_09_15_2026_ssp_data.hdf5 -P docs/source/oc_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/oc-mock-galaxies-v1/diffsky_c260710_test_09_15_2026_transmission_curves.hdf5 -P docs/source/oc_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/oc-mock-galaxies-v1/diffsky_c260710_test_09_15_2026_t_table.hdf5 -P docs/source/oc_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/oc-mock-galaxies-v1/testmock_cfg.yaml -P docs/source/oc_download_dir

      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/oc-mock-galaxies-v1/lc_cores-411.diffsky_gals.hdf5 -P docs/source/oc_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/oc-mock-galaxies-v1/lc_cores-421.diffsky_gals.hdf5 -P docs/source/oc_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/oc-mock-galaxies-v1/lc_cores-432.diffsky_gals.hdf5 -P docs/source/oc_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/oc-mock-galaxies-v1/lc_cores-442.diffsky_gals.hdf5 -P docs/source/oc_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/oc-mock-galaxies-v1/lc_cores-453.diffsky_gals.hdf5 -P docs/source/oc_download_dir
      - wget -q https://github.com/ArgonneCPAC/diffsky-data/releases/download/oc-mock-galaxies-v1/lc_cores-464.diffsky_gals.hdf5 -P docs/source/oc_download_dir

      - ls -l docs/source/oc_download_dir

conda:
  environment: docs/source/rtd_environment.yaml

python:
  install:
    - method: pip
      path: .
