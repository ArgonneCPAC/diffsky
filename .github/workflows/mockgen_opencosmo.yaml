name: make_lj_mock.py synthetic halos

on:
  workflow_dispatch: null
  schedule:
    # Runs "every Monday & Thursday at 3:05am Central"
    - cron: '5 8 * * 1,4'
  push:
    branches:
      - main
  pull_request: null

jobs:
  mock-generation:
    name: python make_lj_mock.py testing_lj_mock_config.yaml (opencosmo ${{ matrix.opencosmo }})
    runs-on: "ubuntu-latest"

    strategy:
      fail-fast: false
      matrix:
        opencosmo: [release, main]

    env:
      # Force UCX to use standard TCP/shared memory
      UCX_TLS: "tcp,self,sm"

    steps:
      - name: free disk space
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          rm_cmd: "rmz"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: 3.12
          channels: conda-forge
          channel-priority: strict
          show-channel-urls: true
          miniforge-version: latest

      - name: configure conda and install code
        shell: bash -l {0}
        env:
          GITHUB_TOKEN: ${{ secrets.CPAC_PRIVATE_REPO_TOKEN }}
          GITHUB_USER: ${{ secrets.GH_USR_TESTING_TOKEN }}

        run: |
          conda config --set always_yes yes
          conda install --quiet \
            --file=requirements.txt
          conda install --quiet \
            pip \
            setuptools \
            "setuptools_scm>=7,<8" \
            matplotlib \
            astropy>=7 \
            h5py \
            mpi4py \
            mpich \
            pytest \
            opencosmo
          conda uninstall diffmah --force
          conda uninstall diffstar --force
          conda uninstall dsps --force
          conda uninstall diffhalos --force
          pip install --no-deps --no-build-isolation git+https://github.com/ArgonneCPAC/diffmah.git
          pip install --no-deps --no-build-isolation git+https://github.com/ArgonneCPAC/diffstar.git
          pip install --no-deps --no-build-isolation git+https://github.com/ArgonneCPAC/dsps.git
          pip install --no-deps --no-build-isolation git+https://github.com/ArgonneCPAC/diffhalos.git

          if [ "${{ matrix.opencosmo }}" = "main" ]; then
            pip install git+https://github.com/ArgonneCPAC/opencosmo.git
          fi
          pip install git+https://github.com/AstroPatty/diffpipe.git

          python -m pip install --no-build-isolation --no-deps -e .

      - name: download dsps data
        timeout-minutes: 5
        shell: bash -l {0}
        run: |
          WGET_OPTS="-4 --tries=3 --timeout=30 --waitretry=5 --retry-connrefused"

          # Create data directory
          mkdir -p dsps_drn/filters

          # Download data
          cd dsps_drn
          wget $WGET_OPTS https://github.com/ArgonneCPAC/diffsky-data/releases/download/ssp-data-v1/fsps_v0.4.7_mist_c3k_a_kroupa_wNE_logGasU-2.0_logGasZ0.0.sparse.h5

          cd filters
          wget $WGET_OPTS https://github.com/ArgonneCPAC/diffsky-data/releases/download/filters-v1/lsst_u_transmission.h5
          wget $WGET_OPTS https://github.com/ArgonneCPAC/diffsky-data/releases/download/filters-v1/lsst_g_transmission.h5
          wget $WGET_OPTS https://github.com/ArgonneCPAC/diffsky-data/releases/download/filters-v1/lsst_r_transmission.h5
          wget $WGET_OPTS https://github.com/ArgonneCPAC/diffsky-data/releases/download/filters-v1/lsst_i_transmission.h5
          wget $WGET_OPTS https://github.com/ArgonneCPAC/diffsky-data/releases/download/filters-v1/lsst_z_transmission.h5
          wget $WGET_OPTS https://github.com/ArgonneCPAC/diffsky-data/releases/download/filters-v1/lsst_y_transmission.h5
          cd ..
          cd ..

          # download HACC core lightcone
          mkdir -p LastJourney/core-lc-9
          cd LastJourney/core-lc-9
          wget $WGET_OPTS https://github.com/ArgonneCPAC/diffsky-data/releases/download/hacc-data-lastjourney-v3/lc_cores-decomposition.txt

          wget $WGET_OPTS -P step_411 https://github.com/ArgonneCPAC/diffsky-data/releases/download/hacc-data-lastjourney-v3/lc_cores-411.843.hdf5
          wget $WGET_OPTS -P step_421 https://github.com/ArgonneCPAC/diffsky-data/releases/download/hacc-data-lastjourney-v3/lc_cores-421.843.hdf5
          wget $WGET_OPTS -P step_432 https://github.com/ArgonneCPAC/diffsky-data/releases/download/hacc-data-lastjourney-v3/lc_cores-432.843.hdf5
          wget $WGET_OPTS -P step_442 https://github.com/ArgonneCPAC/diffsky-data/releases/download/hacc-data-lastjourney-v3/lc_cores-442.843.hdf5
          wget $WGET_OPTS -P step_453 https://github.com/ArgonneCPAC/diffsky-data/releases/download/hacc-data-lastjourney-v3/lc_cores-453.843.hdf5
          wget $WGET_OPTS -P step_464 https://github.com/ArgonneCPAC/diffsky-data/releases/download/hacc-data-lastjourney-v3/lc_cores-464.843.hdf5
          cd ../..

          # Set environment variable
          export DSPS_DRN="${GITHUB_WORKSPACE}/dsps_drn"
          echo "DSPS_DRN=${DSPS_DRN}" >> $GITHUB_ENV

      - name: create mock with cosmos_fit option
        shell: bash -l {0}
        run: |
          # Create output directory
          mkdir -p ci_test_output

          # Run mock production script with real halos and synthetics
          mpiexec -n 1 python scripts/LJ_LC_MOCKS/make_lj_mock.py scripts/LJ_LC_MOCKS/testing_lj_mock_config.yaml
          mpiexec -n 1 python scripts/LJ_LC_MOCKS/make_lj_mock.py scripts/LJ_LC_MOCKS/testing_lj_mock_config.yaml -synthetic_cores 1

          cp LastJourney/core-lc-9/lc_cores-decomposition.txt ci_test_output/dummy_version_name/

      - name: verify script completed
        shell: bash -l {0}
        run: |
          echo "make_lj_mock.py ran successfully for testing_lj_mock_config.yaml"

      - name: validate mock
        shell: bash -l {0}
        run: |
          python scripts/LJ_LC_MOCKS/inspect_lc_mock.py scripts/LJ_LC_MOCKS/testing_lj_mock_config.yaml

      - name: OpenCosmo toolkit data conversion
        shell: bash -l {0}
        run: |
          mkdir -p ci_test_output/oc_dummy_version_name
          cp ci_test_output/dummy_version_name/* ci_test_output/oc_dummy_version_name/
          rm -rf ci_test_output/oc_dummy_version_name/lc_cores*.hdf5
          diffpipe run ci_test_output/dummy_version_name ci_test_output/oc_dummy_version_name -n 2

      - name: Run tests on OpenCosmo-formatted data
        shell: bash -l {0}
        run: |
          echo "ci_test_output/oc_dummy_version_name ready for testing"
          # Here we can execute a testing script of ci_test_output/oc_dummy_version_name
          export RUN_OPENCOSMO_TESTS="true"
          export OPENCOSMO_DIFFSKY_DATA_PATH="ci_test_output/oc_dummy_version_name"
          pytest diffsky/data_loaders/opencosmo_utils/test

      - name: remove cosmos_fit mock
        shell: bash -l {0}
        run: |
          rm -rf ci_test_output
